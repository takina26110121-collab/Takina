<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個人數位名片</title>
  <!-- 引入圓潤可愛的字體 -->
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
  <!-- 連結外部 CSS 樣式表 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 名片主卡片區塊 -->
  <main class="card">
    
    <!-- 圓形大頭貼 -->
    <div class="avatar-wrapper">
      <img src="https://i.postimg.cc/Dwp4xZXL/836468155-1120624843713953-6108202038115422160-n.jpg" alt="個人大頭貼" class="avatar">
    </div>

    <!-- 姓名與自我介紹 -->
    <h1 class="name">林宥杰</h1>
    <p class="bio">✨ 遊走在各大漫展的旅行家 🎨</p>

    <!-- 社群按鈕區塊 -->
    <div class="button-group">
      <a href="https://www.instagram.com/takina_240?exln=cTQ4cXc2MTkycTly&utm_source=qr" target="_blank" rel="noopener noreferrer" class="btn btn-ig">
        Instagram
      </a>
      <a href="mailto:example@email.com" class="btn btn-email">
        Email Me
      </a>
    </div>

  </main>

</body>
</html>
