<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個人數位名片</title>
  <!-- 引入圓潤可愛的字體 -->
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    /* --- 1. 全域重置與畫面置中 --- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Zen Maru Gothic', sans-serif;
      /* 粉嫩馬卡龍漸層背景 */
      background: linear-gradient(135deg, #ffd1dc 0%, #e8dff5 50%, #fce1e4 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* --- 2. 現代感名片主卡片 --- */
    .card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      width: 100%;
      max-width: 360px;
      padding: 40px 30px;
      border-radius: 28px;
      text-align: center;
      /* 柔和多層次粉嫩陰影 */
      box-shadow: 0 15px 35px rgba(230, 160, 180, 0.25),
                  0 5px 15px rgba(0, 0, 0, 0.05);
      border: 2px solid #ffffff;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    /* 微動態：懸停時卡片輕微浮起 */
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 40px rgba(230, 160, 180, 0.35),
                  0 8px 20px rgba(0, 0, 0, 0.06);
    }

    /* --- 3. 圓形大頭貼 --- */
    .avatar-wrapper {
      margin-bottom: 20px;
      display: inline-block;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #ffffff;
      box-shadow: 0 8px 18px rgba(255, 182, 193, 0.4);
    }

    /* --- 4. 文字樣式 --- */
    .name {
      font-size: 1.5rem;
      color: #5a4b56;
      margin-bottom: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .bio {
      font-size: 0.95rem;
      color: #8c7a87;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    /* --- 5. 馬卡龍色系按鈕 --- */
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 12px 20px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Instagram 馬卡龍粉紅按鈕 */
    .btn-ig {
      background-color: #fca3b7;
      color: #ffffff;
      box-shadow: 0 6px 16px rgba(252, 163, 183, 0.4);
    }

    .btn-ig:hover {
      background-color: #f98ca4;
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 10px 20px rgba(252, 163, 183, 0.5);
    }

    /* Email 馬卡龍薄荷綠按鈕 */
    .btn-email {
      background-color: #b5ead7;
      color: #4a6b5d;
      box-shadow: 0 6px 16px rgba(181, 234, 215, 0.5);
    }

    .btn-email:hover {
      background-color: #a0e0cb;
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 10px 20px rgba(181, 234, 215, 0.6);
    }
  </style>
</head>
<body>

  <!-- 名片主卡片區塊 -->
  <main class="card">
    
    <!-- 圓形大頭貼 -->
    <div class="avatar-wrapper">
      <img src="https://i.postimg.cc/Dwp4xZXL/836468155-1120624843713953-6108202038115422160-n.jpg" alt="個人大頭貼" class="avatar">
    </div>

    <!-- 姓名與自我介紹 -->
    <h1 class="name">林宥杰</h1>
    <p class="bio">✨ 遊走在各大漫展的旅行家 🎨</p>

    <!-- 社群按鈕區塊 -->
    <div class="button-group">
      <a href="https://www.instagram.com/takina_240?exln=cTQ4cXc2MTkycTly&utm_source=qr" target="_blank" rel="noopener noreferrer" class="btn btn-ig">
        Instagram
      </a>
      <a href="mailto:example@email.com" class="btn btn-email">
        Email Me
      </a>
    </div>

  </main>

</body>
</html>
