<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 3 - 迷因產生器 Meme Generator</title>
    <!-- 引入 Google Fonts 可愛圓潤字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mochiyom+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    <!-- 引入 html2canvas CDN 供截圖下載使用 -->
    <script src="https://i.postimg.cc/43dXs5y3/747526367-2173732920141908-371604200835960710-n.jpg"></script>

    <style>
        /* ==================== 基礎與變數設定 ==================== */
        :root {
            --bg-grad-1: #ffe6f2;
            --bg-grad-2: #e8f4ff;
            --bg-grad-3: #fff3e0;
            --primary-pink: #ff85a1;
            --primary-purple: #b39ddb;
            --card-bg: #ffffff;
            --text-dark: #5a4b5c;
            --text-muted: #a099a8;
            --shadow-pop: 0 10px 25px rgba(255, 133, 161, 0.25);
            --shadow-card: 0 8px 20px rgba(180, 160, 200, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Zen Maru Gothic', 'Mochiyom Pop One', sans-serif;
            background: linear-gradient(135deg, var(--bg-grad-1), var(--bg-grad-2), var(--bg-grad-3));
            background-size: 300% 300%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-dark);
            min-height: 100vh;
            padding: 30px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 浮動氣泡背景裝飾 */
        .bg-bubbles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            animation: floatUp 8s infinite ease-in-out;
        }

        .bubble:nth-child(1) { width: 60px; height: 60px; left: 10%; animation-duration: 7s; }
        .bubble:nth-child(2) { width: 90px; height: 90px; left: 85%; animation-duration: 9s; animation-delay: 1s; }
        .bubble:nth-child(3) { width: 40px; height: 40px; left: 70%; animation-duration: 6s; animation-delay: 2s; }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.8); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        .container {
            max-width: 1050px;
            width: 100%;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 頂部標題 */
        .header-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .header-title h1 {
            font-family: 'Mochiyom Pop One', sans-serif;
            font-size: 2rem;
            color: #524364;
            margin-bottom: 8px;
            text-shadow: 2px 2px 0px #fff;
        }

        .header-title p {
            font-size: 0.95rem;
            color: #8c7b99;
            font-weight: 700;
        }

        /* ==================== 左右雙欄主佈局 (RWD) ==================== */
        .generator-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            width: 100%;
            align-items: start;
        }

        @media (max-width: 768px) {
            .generator-layout {
                grid-template-columns: 1fr;
            }
        }

        /* 控制面板卡片 & 預覽卡片通用樣式 */
        .panel-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 25px;
            border: 4px solid #ffffff;
            box-shadow: var(--shadow-pop);
            width: 100%;
        }

        .panel-title {
            font-size: 1.2rem;
            font-weight: 900;
            color: #524364;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 表單控制元件 */
        .control-group {
            margin-bottom: 18px;
        }

        .control-group label {
            display: block;
            font-size: 0.88rem;
            font-weight: 700;
            color: #7d6b8d;
            margin-bottom: 6px;
        }

        /* 自定義上傳檔案按鈕外觀 */
        .file-upload-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-upload-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ff9a9e, #fecfef);
            color: #fff;
            text-align: center;
            font-weight: 900;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 133, 161, 0.3);
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .file-upload-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .file-upload-wrapper input[type="file"] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        /* 文字輸入框 */
        .text-input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 14px;
            border: 2px solid #e0d4e8;
            font-family: 'Zen Maru Gothic', sans-serif;
            font-size: 0.95rem;
            color: var(--text-dark);
            background: #faf6fd;
            outline: none;
            transition: border-color 0.2s;
        }

        .text-input:focus {
            border-color: var(--primary-pink);
            background: #fff;
        }

        /* 滑桿調整區 */
        .range-slider {
            width: 100%;
            accent-color: #ff85a1;
            cursor: pointer;
        }

        .range-value {
            float: right;
            font-size: 0.8rem;
            color: #b39ddb;
            font-weight: bold;
        }

        /* ==================== 迷因即時預覽區 ==================== */
        .preview-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 迷因畫布主體 (截圖範圍) */
        #meme-canvas-box {
            position: relative;
            width: 100%;
            max-width: 450px;
            aspect-ratio: 4 / 3;
            background: #f4ecf9;
            border-radius: 20px;
            overflow: hidden;
            border: 4px solid #fff;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #meme-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* 迷因上下文字特效 (自動加上粗黑色外框確保清晰) */
        .meme-text {
            position: absolute;
            width: 90%;
            text-align: center;
            font-family: 'Mochiyom Pop One', sans-serif;
            color: #ffffff;
            text-shadow: 
                -3px -3px 0 #000,  
                 3px -3px 0 #000,
                -3px  3px 0 #000,
                 3px  3px 0 #000,
                 0px  4px 8px rgba(0,0,0,0.6);
            left: 50%;
            transform: translateX(-50%);
            word-break: break-all;
            pointer-events: none;
            line-height: 1.2;
        }

        #top-text-view {
            top: 10%; /* 預設位置，可藉由滑桿動態調整 */
        }

        #bottom-text-view {
            bottom: 10%; /* 預設位置，可藉由滑桿動態調整 */
        }

        /* 提示文字 */
        .upload-tip {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-align: center;
            margin: auto;
            padding: 20px;
        }

        /* 下載按鈕 */
        .download-btn {
            margin-top: 20px;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #b39ddb, #9575cd);
            color: #fff;
            font-family: 'Mochiyom Pop One', sans-serif;
            font-size: 1rem;
            border: none;
            border-radius: 18px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(179, 157, 219, 0.4);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(179, 157, 219, 0.6);
        }

        .download-btn:active {
            transform: translateY(-1px);
        }

        /* 返回作品集按鈕列 */
        .back-nav {
            margin-top: 30px;
            text-align: center;
        }

        .back-link {
            text-decoration: none;
            color: #8c7b99;
            font-weight: 700;
            font-size: 0.9rem;
            background: rgba(255,255,255,0.7);
            padding: 8px 18px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: all 0.2s;
        }

        .back-link:hover {
            background: #fff;
            color: #ff85a1;
        }

        /* 頁尾 */
        footer {
            margin-top: 30px;
            color: #8c7b99;
            font-size: 0.8rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- 背景動態氣泡 -->
    <div class="bg-bubbles">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <div class="container">
        <!-- 網頁標題區 -->
        <div class="header-title">
            <h1>😂 Week 3-迷因產生器</h1>
            <p>✨上傳你的梗圖，製作專屬搞笑迷因！✨</p>
        </div>

        <!-- 左右雙欄配置：左側控制面板、右側即時預覽 -->
        <div class="generator-layout">
            
            <!-- 左側：控制面板 -->
            <div class="panel-card">
                <div class="panel-title"><span>🛠️</span> 迷因設定選單</div>

                <!-- 1. 圖片上傳 (使用 input file 避開 CORS 錯誤) -->
                <div class="control-group">
                    <label>1. 選擇底圖 (本機上傳)</label>
                    <div class="file-upload-wrapper">
                        <span class="file-upload-btn">📁 點擊上傳圖片</span>
                        <input type="file" id="image-input" accept="image/*">
                    </div>
                </div>

                <!-- 2. 上方文字輸入 -->
                <div class="control-group">
                    <label>2. 上方文字</label>
                    <input type="text" id="top-text-input" class="text-input" placeholder="輸入上方搞笑文字..." value="當你寫扣寫到崩潰時">
                </div>

                <!-- 3. 下方文字輸入 -->
                <div class="control-group">
                    <label>3. 下方文字</label>
                    <input type="text" id="bottom-text-input" class="text-input" placeholder="輸入下方搞笑文字..." value="但隔天發現竟然跑過了好開心">
                </div>

                <!-- 4. 字體大小滑桿 -->
                <div class="control-group">
                    <label>4. 字體大小 <span id="font-size-val" class="range-value">24px</span></label>
                    <input type="range" id="font-size-range" class="range-slider" min="14" max="48" value="24">
                </div>

                <!-- 5. 上方文字位置滑桿 -->
                <div class="control-group">
                    <label>5. 上方文字垂直位置 <span id="top-pos-val" class="range-value">10%</span></label>
                    <input type="range" id="top-pos-range" class="range-slider" min="2" max="50" value="10">
                </div>

                <!-- 6. 下方文字位置滑桿 -->
                <div class="control-group">
                    <label>6. 下方文字垂直位置 <span id="bottom-pos-val" class="range-value">10%</span></label>
                    <input type="range" id="bottom-pos-range" class="range-slider" min="2" max="50" value="10">
                </div>
            </div>

            <!-- 右側：即時預覽與下載區 -->
            <div class="preview-container">
                <div class="panel-card" style="display: flex; flex-direction: column; align-items: center;">
                    <div class="panel-title" style="align-self: flex-start;"><span>👀</span> 即時預覽區</div>
                    
                    <!-- 包含圖片與文字的迷因畫布容器 (html2canvas 截圖目標) -->
                    <div id="meme-canvas-box">
                        <div id="upload-tip" class="upload-tip">請先於左側上傳圖片 🐾</div>
                        <img id="meme-image" style="display: none;" alt="迷因底圖">
                        <div id="top-text-view" class="meme-text">當你寫扣寫到崩潰時</div>
                        <div id="bottom-text-view" class="meme-text">但隔天發現竟然跑過了好開心</div>
                    </div>

                    <!-- 下載按鈕 -->
                    <button id="download-btn" class="download-btn">
                        <span>📥</span> 下載我的迷因圖 (my-meme.png)
                    </button>
                </div>
            </div>

        </div>

        <!-- 返回入口首頁按鈕 -->
        <div class="back-nav">
            <a href="../index.html" class="back-link">🏠 回到作品集入口地圖</a>
        </div>

        <footer>
            © 2026 網頁程式設計課程作品集 | Keep Coding & Stay Cute!
        </footer>
    </div>

    <!-- ==================== JavaScript 功能實作 ==================== -->
    <script>
        // 取得 DOM 元素
        const imageInput = document.getElementById('image-input');
        const memeImage = document.getElementById('meme-image');
        const uploadTip = document.getElementById('upload-tip');

        const topTextInput = document.getElementById('top-text-input');
        const bottomTextInput = document.getElementById('bottom-text-input');
        const topTextView = document.getElementById('top-text-view');
        const bottomTextView = document.getElementById('bottom-text-view');

        const fontSizeRange = document.getElementById('font-size-range');
        const fontSizeVal = document.getElementById('font-size-val');

        const topPosRange = document.getElementById('top-pos-range');
        const topPosVal = document.getElementById('top-pos-val');

        const bottomPosRange = document.getElementById('bottom-pos-range');
        const bottomPosVal = document.getElementById('bottom-pos-val');

        const downloadBtn = document.getElementById('download-btn');
        const memeCanvasBox = document.getElementById('meme-canvas-box');

        // 1. 處理本機圖片上傳與預覽 (使用 FileReader 避開跨域 CORS 限制)
        imageInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    memeImage.src = e.target.result;
                    memeImage.style.display = 'block';
                    uploadTip.style.display = 'none'; // 隱藏提示文字
                }
                reader.readAsDataURL(file);
            }
        });

        // 2. 即時同步上方文字輸入
        topTextInput.addEventListener('input', function() {
            topTextView.textContent = this.value;
        });

        // 3. 即時同步下方文字輸入
        bottomTextInput.addEventListener('input', function() {
            bottomTextView.textContent = this.value;
        });

        // 4. 即時調整字體大小
        fontSizeRange.addEventListener('input', function() {
            const size = this.value + 'px';
            topTextView.style.fontSize = size;
            bottomTextView.style.fontSize = size;
            fontSizeVal.textContent = size;
        });

        // 5. 即時調整上方文字垂直位置 (Top)
        topPosRange.addEventListener('input', function() {
            const pos = this.value + '%';
            topTextView.style.top = pos;
            topPosVal.textContent = pos;
        });

        // 6. 即時調整下方文字垂直位置 (Bottom)
        bottomPosRange.addEventListener('input', function() {
            const pos = this.value + '%';
            bottomTextView.style.bottom = pos;
            bottomPosVal.textContent = pos;
        });

        // 7. 一鍵截圖下載功能 (使用 html2canvas)
        downloadBtn.addEventListener('click', function() {
            // 檢查是否已上傳圖片
            if (memeImage.style.display === 'none') {
                alert('請先上傳一張底圖才能下載迷因唷！✨');
                return;
            }

            // 呼叫 html2canvas 將指定的區塊轉為畫布
            html2canvas(memeCanvasBox, {
                useCORS: true, // 允許載入跨域或本機資源
                scale: 2       // 提高解析度讓下載圖片更清晰
            }).then(canvas => {
                // 建立一個暫時的下載連結
                const link = document.createElement('a');
                link.download = 'my-meme.png';
                link.href = canvas.toDataURL('image/png');
                link.click(); // 自動觸發下載
            }).catch(err => {
                console.error('截圖失敗：', err);
                alert('圖片下載時發生了一點小意外，請再試一次！');
            });
        });
    </script>
</body>
</html>
