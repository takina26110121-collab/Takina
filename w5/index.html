<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雲端心電感應 - 皇家默契盛宴</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        rosegold: {
                            50: '#FDF7F6',
                            100: '#F9ECE9',
                            200: '#F2D3CC',
                            300: '#E7B4A7',
                            400: '#D78B7D',
                            500: '#B76E79',
                            600: '#9E525D',
                            700: '#823D47',
                            800: '#683139',
                            900: '#4A2127',
                        },
                        royal: {
                            dark: '#140A18',
                            card: '#221229',
                            gold: '#F3C667'
                        }
                    }
                }
            }
        };
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Serif TC', serif;
            background: radial-gradient(circle at 50% 30%, #2A1433 0%, #140A18 100%);
        }
        .font-cinzel { font-family: 'Cinzel', serif; }
        
        .perspective-1000 { perspective: 1000px; }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }
        .card-inner.is-flipped { transform: rotateY(180deg); }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 1rem;
        }
        .card-back { transform: rotateY(180deg); }

        .btn-rosegold {
            background: linear-gradient(135deg, #E7B4A7 0%, #B76E79 50%, #823D47 100%);
            box-shadow: 0 4px 15px rgba(183, 110, 121, 0.35);
            transition: all 0.3s ease;
        }
        .btn-rosegold:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(183, 110, 121, 0.55);
        }
        .royal-border { border: 1px solid rgba(243, 198, 103, 0.3); }
    </style>
</head>
<body class="text-rosegold-100 min-h-screen flex flex-col justify-between p-4 selection:bg-rosegold-500 selection:text-white">

    <!-- 頁頭 -->
    <header class="max-w-4xl mx-auto w-full flex justify-between items-center border-b border-rosegold-500/30 pb-4">
        <div>
            <h1 class="font-cinzel text-2xl md:text-3xl font-black bg-clip-text text-transparent bg-gradient-to-r from-rosegold-200 via-rosegold-400 to-royal-gold tracking-wide">
                ROYAL TELEPATHY
            </h1>
            <p class="text-[11px] text-rosegold-300 tracking-widest uppercase">雲端心電感應 · 皇家默契大考驗</p>
        </div>

        <div class="flex items-center space-x-3">
            <div id="room-badge" class="hidden bg-royal-card border border-rosegold-500/50 px-3.5 py-1 rounded-full text-xs text-rosegold-200">
                房號: <span id="display-room-id" class="font-bold text-royal-gold font-mono text-sm">--</span>
            </div>
            
            <!-- 隱藏房主開關圖示 -->
            <button id="toggle-host-btn" 
                    type="button"
                    onclick="toggleHostPanel()" 
                    title="切換房主控制台" 
                    class="opacity-40 hover:opacity-100 transition-opacity p-2 text-rosegold-300 text-xl hover:scale-110 active:scale-95 cursor-pointer select-none">
                👑
            </button>
        </div>
    </header>

    <!-- 主要內容 -->
    <main class="max-w-4xl mx-auto w-full my-auto py-6">

        <!-- 登入與建立房間大廳 -->
        <div id="view-login" class="max-w-md mx-auto bg-royal-card/90 backdrop-blur-md p-8 rounded-2xl royal-border shadow-2xl">
            <div class="text-center mb-6">
                <span class="text-xs font-cinzel text-royal-gold tracking-widest uppercase">Welcome To The Royal Court</span>
                <h2 class="text-2xl font-bold text-rosegold-100 mt-1">加入心電感應大廳</h2>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs text-rosegold-300 mb-1 font-medium">您的尊名 (玩家暱稱)</label>
                    <input type="text" id="input-player-name" placeholder="請輸入名字" 
                           class="w-full bg-royal-dark border border-rosegold-500/40 rounded-xl px-4 py-3 text-rosegold-100 focus:outline-none focus:border-rosegold-400 transition-colors">
                </div>

                <div>
                    <label class="block text-xs text-rosegold-300 mb-1 font-medium">房間代碼 (填寫或生成新房號)</label>
                    <div class="flex space-x-2">
                        <input type="text" id="input-room-id" placeholder="例如: 888" 
                               class="w-full bg-royal-dark border border-rosegold-500/40 rounded-xl px-4 py-3 text-rosegold-100 focus:outline-none focus:border-rosegold-400 uppercase font-mono tracking-wider">
                        <button type="button" onclick="generateRandomRoom()" 
                                class="px-4 bg-rosegold-900 border border-rosegold-500/50 text-xs rounded-xl text-rosegold-200 hover:bg-rosegold-800 transition-colors whitespace-nowrap">
                            隨機房號
                        </button>
                    </div>
                </div>

                <button type="button" onclick="joinRoom()" 
                        class="w-full btn-rosegold font-bold py-3.5 rounded-xl text-royal-dark text-base tracking-wider mt-4">
                    進入遊戲房間
                </button>
            </div>
        </div>

        <!-- 遊戲主要介面 -->
        <div id="view-game" class="hidden space-y-6">
            <div class="text-center bg-royal-card/60 p-6 rounded-2xl royal-border backdrop-blur-md relative overflow-hidden">
                <div class="absolute -top-12 -left-12 w-24 h-24 bg-rosegold-500/10 rounded-full blur-xl"></div>
                <span class="text-xs font-cinzel tracking-widest text-rosegold-400 uppercase">Current Question</span>
                <h2 id="display-question" class="text-2xl md:text-3xl font-black text-royal-gold mt-2 tracking-wide">
                    等待房主出題中...
                </h2>
            </div>

            <div id="answer-input-box" class="max-w-md mx-auto flex space-x-2">
                <input type="text" id="input-my-answer" placeholder="寫下你的默契答案..." 
                       class="flex-1 bg-royal-dark border border-rosegold-500/50 rounded-xl px-4 py-3 text-rosegold-100 focus:outline-none focus:border-rosegold-400">
                <button type="button" onclick="submitAnswer()" class="btn-rosegold font-bold px-6 py-3 rounded-xl text-royal-dark whitespace-nowrap">
                    送出答案
                </button>
            </div>

            <!-- 3D 卡片渲染區 -->
            <div id="cards-container" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 pt-2"></div>
        </div>

    </main>

    <!-- 隱藏房主控制台 -->
    <div id="host-panel" class="hidden max-w-4xl mx-auto w-full mb-6 bg-rosegold-950/95 border border-royal-gold/60 p-5 rounded-2xl shadow-2xl backdrop-blur-md">
        <div class="flex justify-between items-center mb-4 pb-2 border-b border-rosegold-500/30">
            <h3 class="text-sm font-bold text-royal-gold flex items-center gap-2">
                <span>👑</span> 尊貴房主控制台 (Hidden Host Console)
            </h3>
            <span class="text-xs text-rosegold-300">目前控制房號: <b id="host-room-id" class="text-white font-mono">--</b></span>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
            <div class="md:col-span-2 flex gap-2">
                <input type="text" id="host-question-input" placeholder="請輸入本次心電感應題目..." 
                       class="flex-1 bg-royal-dark border border-rosegold-500/50 rounded-lg px-3 py-2 text-sm text-rosegold-100 focus:outline-none focus:border-rosegold-400">
                <button type="button" onclick="hostSetQuestion()" class="bg-rosegold-700 hover:bg-rosegold-600 text-white px-4 py-2 text-sm rounded-lg font-medium border border-rosegold-500/50 transition-colors whitespace-nowrap">
                    出題開局
                </button>
            </div>
            <div class="flex gap-2">
                <button type="button" onclick="hostReveal()" class="flex-1 bg-gradient-to-r from-amber-500 to-royal-gold text-royal-dark font-bold px-4 py-2 text-sm rounded-lg hover:brightness-110 transition-all shadow-lg whitespace-nowrap">
                    ✨ 萬眾開牌 ✨
                </button>
                <button type="button" onclick="hostReset()" class="bg-gray-800 hover:bg-gray-700 text-rosegold-200 px-3 py-2 text-sm rounded-lg border border-gray-700 transition-colors whitespace-nowrap">
                    重置
                </button>
            </div>
        </div>
    </div>

    <!-- 頁尾 -->
    <footer class="text-center text-[11px] text-rosegold-400/50 py-2 font-cinzel">
        Royal Telepathy Game &copy; 2026. Powered by Google Apps Script & Tailwind.
    </footer>

    <!-- JS 邏輯腳本 -->
    <script>
        const SHEET_NAME = 'TelepathyData';
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzannFgZZeXggYHORNMX-I6FICwq4X5o0UO-VKKSM2-p5AV_B1AixRsoSBNDVheOnEN/exec";

        let roomId = "";
        let playerName = "";
        let pollingTimer = null;

        function generateRandomRoom() {
            const code = Math.floor(1000 + Math.random() * 9000).toString();
            document.getElementById('input-room-id').value = code;
        }

        // 房主面板切換邏輯
        function toggleHostPanel() {
            const panel = document.getElementById('host-panel');
            if (panel) {
                panel.classList.toggle('hidden');
            } else {
                console.error("找不到 ID 為 host-panel 的元素！");
            }
        }

        function joinRoom() {
            const nameInput = document.getElementById('input-player-name').value.trim();
            let roomInput = document.getElementById('input-room-id').value.trim();

            if (!nameInput) {
                alert("請輸入您的尊名！");
                return;
            }

            if (!roomInput) {
                roomInput = "8888";
            }

            playerName = nameInput;
            roomId = roomInput.toUpperCase();

            document.getElementById('display-room-id').innerText = roomId;
            document.getElementById('host-room-id').innerText = roomId;
            document.getElementById('room-badge').classList.remove('hidden');

            document.getElementById('view-login').classList.add('hidden');
            document.getElementById('view-game').classList.remove('hidden');

            fetchGameState();
            if (pollingTimer) clearInterval(pollingTimer);
            pollingTimer = setInterval(fetchGameState, 2000);
        }

        async function fetchGameState() {
            if (!roomId) return;
            try {
                const res = await fetch(`${GAS_API_URL}?room=${encodeURIComponent(roomId)}`);
                const data = await res.json();
                renderGame(data);
            } catch (err) {
                console.error("輪詢擷取資料失敗:", err);
            }
        }

        async function postGAS(payload) {
            try {
                payload.room = roomId;
                await fetch(GAS_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                fetchGameState();
            } catch (err) {
                console.error("發送請求失敗:", err);
            }
        }

        function renderGame(data) {
            const { status, question, answers } = data;
            
            document.getElementById('display-question').innerText = question || "等待房主出題中...";

            const answerBox = document.getElementById('answer-input-box');
            if (status === 'playing') {
                answerBox.classList.remove('hidden');
            } else {
                answerBox.classList.add('hidden');
            }

            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            const playerNames = Object.keys(answers || {});
            
            if (playerNames.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center text-rosegold-300/60 py-12">目前房內尚無作答紀錄...</div>`;
                return;
            }

            playerNames.forEach(name => {
                const answerText = answers[name];
                const isRevealed = (status === 'revealed');
                const isMe = (name === playerName);

                const cardHTML = `
                    <div class="h-44 perspective-1000">
                        <div class="card-inner ${isRevealed ? 'is-flipped' : ''} shadow-2xl">
                            <!-- 正面 -->
                            <div class="card-front bg-gradient-to-br from-royal-card via-rosegold-950 to-royal-dark border ${isMe ? 'border-royal-gold' : 'border-rosegold-500/40'} p-4 flex flex-col justify-between items-center text-center">
                                <div class="w-full flex justify-between items-center">
                                    <span class="text-[10px] ${isMe ? 'text-royal-gold font-bold' : 'text-rosegold-400'}">${isMe ? '★ 本人' : '玩家'}</span>
                                    <span class="w-2.5 h-2.5 rounded-full ${answerText ? 'bg-emerald-400 shadow-[0_0_8px_#34d399]' : 'bg-gray-600'}"></span>
                                </div>
                                <div class="my-auto">
                                    <h4 class="font-bold text-lg text-rosegold-100 tracking-wide">${name}</h4>
                                    <p class="text-xs text-rosegold-400 mt-1">${answerText ? '已鎖定答案' : '思考中...'}</p>
                                </div>
                                <div class="text-[10px] text-royal-gold/60 font-cinzel tracking-widest">ROYAL CARD</div>
                            </div>
                            
                            <!-- 背面 -->
                            <div class="card-back bg-gradient-to-br from-rosegold-700 via-rosegold-600 to-rosegold-800 border-2 border-royal-gold p-4 flex flex-col justify-between items-center text-center">
                                <span class="text-[11px] text-royal-gold font-bold tracking-wider uppercase">${name} 的答案</span>
                                <div class="my-auto w-full px-2">
                                    <p class="text-xl font-black text-white drop-shadow-md break-words">${answerText}</p>
                                </div>
                                <div class="text-[9px] text-rosegold-200/60 tracking-widest font-cinzel">TELEPATHY MATCH</div>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        function submitAnswer() {
            const ans = document.getElementById('input-my-answer').value.trim();
            if (!ans) {
                alert("請填寫答案！");
                return;
            }
            postGAS({
                action: "submit_answer",
                playerName: playerName,
                answer: ans
            });
            document.getElementById('input-my-answer').value = '';
            alert("答案已成功傳送！等待房主宣佈開牌。");
        }

        function hostSetQuestion() {
            const q = document.getElementById('host-question-input').value.trim();
            if (!q) {
                alert("請輸入題目！");
                return;
            }
            postGAS({
                action: "set_question",
                question: q
            });
        }

        function hostReveal() {
            postGAS({ action: "reveal" });
        }

        function hostReset() {
            if (confirm("確定要重置目前房間的狀態嗎？")) {
                postGAS({ action: "reset" });
            }
        }
    </script>
</body>
</html>
